version: '3.8'

services:
  # Название нашего сервиса инференса модели
  car-price-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: car_price_service
    # Проброс портов: порт_хоста:порт_контейнера
    # Позволяет обращаться к приложению через http://localhost:8000 на компьютере
    ports:
      - "8000:8000"
    # Политика перезапуска: контейнер будет автоматически перезапущен
    # при падении или перезагрузке Docker-демона
    restart: always
    # Ограничения по ресурсам (хорошая практика для стабильности сервера)
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 1G

